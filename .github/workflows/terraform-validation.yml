name: Terraform validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@ae78205cfffec3e8d7eaf7b4b745891b8e1b5c7a # v4.0.0
        with:
          tflint_version: v0.55.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install checkov==3.2.372
      - name: Install Gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: terraform fmt -check -recursive
      - run: ./scripts/validate_modules.sh
      - run: ./scripts/security_scan.sh
      - name: Check documentation presence
        run: test -s README.md && test "$(find modules -mindepth 2 -maxdepth 2 -name README.md | wc -l)" -eq "$(find modules -mindepth 1 -maxdepth 1 -type d | wc -l)"
