---
- name: Install web server package
  ansible.builtin.package:
    name: "{{ web_server_package_name }}"
    state: present

- name: Ensure web document root exists
  ansible.builtin.file:
    path: "{{ web_server_document_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy sample index page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ web_server_document_root }}/index.html"
    owner: root
    group: root
    mode: "0644"
  notify: Restart web server

- name: Ensure web server is enabled and started
  ansible.builtin.service:
    name: "{{ web_server_service_name }}"
    state: started
    enabled: true
